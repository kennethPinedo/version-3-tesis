# Nginx delante de FastAPI dentro de la instancia EC2.
#
# Hace tres cosas: publicar en el puerto 80, no delatar la versión del servidor,
# y dejar preparado el sitio donde irá el certificado HTTPS.

server {
    listen 80;
    server_name _;

    # La subida de expedientes son PDF escaneados; el backend los limita a
    # 10 MB, así que nginx no debe cortarlos antes con su tope de 1 MB.
    client_max_body_size 12M;

    # No anunciar la versión de nginx: es información gratuita para quien
    # busque vulnerabilidades conocidas.
    server_tokens off;

    # Cabeceras de seguridad básicas. La API responde JSON, pero el navegador
    # las aplica igualmente y cuestan cero.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        # Sin esto, el backend ve como IP de origen la del contenedor de nginx
        # y no la del usuario real.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar una predicción con SHAP puede tardar unos segundos; el tope
        # por defecto de 60 s se queda corto en la primera petición, cuando
        # además hay que cargar los modelos.
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # El health check de la instancia no necesita llenar el registro.
    location = / {
        proxy_pass http://api:8000/;
        access_log off;
    }
}
